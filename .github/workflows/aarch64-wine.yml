# Build the Wine and FEX runtime vstbridge uses on aarch64 (Raspberry Pi 5 / Pivuan).
#
# - wine: wine-staging built for ARM64EC (arm64ec,aarch64,i386) with vstbridge's patches from
#   aarch64/wine/patches, installed to /opt/vstbridge/wine
# - fex: FEX's libarm64ecfex.dll and libwow64fex.dll plus their unixlibs, which install over
#   that Wine tree
#
# Both tarballs extract at /. Versions are pinned in aarch64/versions.sh. The builds are
# cached on the hash of the scripts, versions and patches, so a run only rebuilds what changed.

name: aarch64 Wine and FEX

on:
  workflow_dispatch:
  push:
    branches: [arm64]
    paths:
      - "aarch64/**"
      - ".github/workflows/aarch64-wine.yml"

permissions:
  contents: read

concurrency:
  group: aarch64-wine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wine:
    name: Wine (ARM64EC)
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    timeout-minutes: 300
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Tools
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends git ca-certificates zstd

      - uses: actions/checkout@v4

      - name: Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: dist/vstbridge-wine-aarch64.tar.xz
          key: wine-${{ hashFiles('aarch64/versions.sh', 'aarch64/lib.sh', 'aarch64/build-wine.sh', 'aarch64/wine/patches/**') }}

      - name: Build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          apt-get install -y -q --no-install-recommends \
            build-essential autoconf bison flex gettext perl python3 patch pkg-config curl xz-utils \
            libx11-dev libxext-dev libxcomposite-dev libxcursor-dev libxfixes-dev libxinerama-dev \
            libxi-dev libxrandr-dev libxrender-dev libxxf86vm-dev \
            libegl-dev libgl-dev libvulkan-dev \
            libfreetype-dev libfontconfig-dev libgnutls28-dev \
            libasound2-dev libdbus-1-dev libudev-dev

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p dist
          aarch64/build-wine.sh "$RUNNER_TEMP/wine" dist/vstbridge-wine-aarch64.tar.xz

      - uses: actions/upload-artifact@v4
        with:
          name: vstbridge-wine-aarch64
          path: dist/vstbridge-wine-aarch64.tar.xz
          compression-level: 0

  fex:
    name: FEX DLLs
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Tools
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends git ca-certificates zstd file xz-utils

      - uses: actions/checkout@v4

      - name: Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: dist/vstbridge-fex-aarch64.tar.xz
          key: fex-${{ hashFiles('aarch64/versions.sh', 'aarch64/lib.sh', 'aarch64/build-fex.sh') }}

      - name: Build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          apt-get install -y -q --no-install-recommends \
            build-essential cmake ninja-build python3 curl

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p dist
          aarch64/build-fex.sh "$RUNNER_TEMP/fex" dist/vstbridge-fex-aarch64.tar.xz

      - name: Check the binaries
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/check"
          tar -C "$RUNNER_TEMP/check" -xJf dist/vstbridge-fex-aarch64.tar.xz
          find "$RUNNER_TEMP/check" -type f -exec file {} +

      - uses: actions/upload-artifact@v4
        with:
          name: vstbridge-fex-aarch64
          path: dist/vstbridge-fex-aarch64.tar.xz
          compression-level: 0
