# Build vstbridge and its Wine for aarch64 (Raspberry Pi 5 / Pivuan) and package them as .debs
# for the Pivuan apt repository.
#
# Built natively on GitHub's arm64 runner in a Debian trixie container, the same setup as
# Pivuan's own apps (rations/build: .github/workflows/pivuan-apps.yml): trixie has the same
# libraries as Devuan excalibur.
#
# - wine: wine-staging built for ARM64EC (arm64ec,aarch64,i386) with vstbridge's patches from
#   aarch64/wine/patches, installed to /opt/vstbridge/wine
# - fex: FEX's libarm64ecfex.dll and libwow64fex.dll plus their unixlibs, which install over
#   that Wine tree
# - native: the plugin and chainloader libraries, vstbridgectl, and the plugin host. Wine does
#   not support Winelib hosts on aarch64, so the host is an ARM64EC PE executable
#   (-Dwine-host=pe, cross compiled with llvm-mingw) plus the native unixlib it uses for Linux
#   APIs. Also the standalone vstbridge-aarch64.tar.gz, kept as a workflow artifact.
# - debs: wine-fex, wine-fex-i386, wine-fex-mono and vstbridge (aarch64/build-debs.sh)
# - check: installs the packages in a clean trixie container and runs vstbridgectl sync, which
#   creates a Wine prefix and starts the plugin host through Wine
#
# Pushes here build and check. The "vstbridge for Pivuan" workflow in rations/pivuan calls this
# workflow (workflow_call) to build the packages in its own run, then publishes the pivuan-debs
# artifact to the Pivuan apt repository with its own token, as it does XLibre. So this
# repository needs no secrets and makes no releases. When called, the jobs check out the
# `repository` and `ref` inputs, because actions/checkout would otherwise check out the caller.
#
# Versions are pinned in aarch64/versions.sh. The Wine and FEX builds are cached on the hash of
# their scripts, versions and patches, so a run only rebuilds what changed. Caches belong to the
# repository whose run made them, so rations/pivuan keeps its own.

name: aarch64 build

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      repository:
        description: "The vstbridge repository to build"
        type: string
        default: rations/vstbridge
      ref:
        description: "The branch, tag or commit of it to build"
        type: string
        required: true
    outputs:
      version:
        description: "vstbridge's package version (without the -pivuan revision)"
        value: ${{ jobs.native.outputs.version }}
  push:
    branches: [arm64]
    paths:
      - "vstbridge/**"
      - "aarch64/**"
      - ".github/workflows/aarch64.yml"
  pull_request:
    branches: [arm64]

permissions:
  contents: read

# In a run of this repository there are no inputs, and the jobs check out the commit that
# started it, as usual.
env:
  VSTBRIDGE_REPOSITORY: ${{ inputs.repository || github.repository }}
  VSTBRIDGE_REF: ${{ inputs.ref }}

concurrency:
  group: aarch64-${{ github.ref }}
  # Never cancel a run started by hand
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  wine:
    name: Wine (ARM64EC)
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    timeout-minutes: 300
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Tools
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends git ca-certificates zstd

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.VSTBRIDGE_REPOSITORY }}
          ref: ${{ env.VSTBRIDGE_REF }}

      - name: Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: dist/vstbridge-wine-aarch64.tar.xz
          key: wine-${{ hashFiles('aarch64/versions.sh', 'aarch64/lib.sh', 'aarch64/build-wine.sh', 'aarch64/wine/patches/**') }}

      - name: Build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          apt-get install -y -q --no-install-recommends \
            build-essential autoconf bison flex gettext perl python3 patch pkg-config curl xz-utils \
            libx11-dev libxext-dev libxcomposite-dev libxcursor-dev libxfixes-dev libxinerama-dev \
            libxi-dev libxrandr-dev libxrender-dev libxxf86vm-dev \
            libegl-dev libgl-dev libvulkan-dev \
            libfreetype-dev libfontconfig-dev libgnutls28-dev \
            libasound2-dev libdbus-1-dev libudev-dev

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p dist
          aarch64/build-wine.sh "$RUNNER_TEMP/wine" dist/vstbridge-wine-aarch64.tar.xz

      - uses: actions/upload-artifact@v4
        with:
          name: vstbridge-wine-aarch64
          path: dist/vstbridge-wine-aarch64.tar.xz
          compression-level: 0

  fex:
    name: FEX DLLs
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Tools
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends git ca-certificates zstd file xz-utils

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.VSTBRIDGE_REPOSITORY }}
          ref: ${{ env.VSTBRIDGE_REF }}

      - name: Cache
        id: cache
        uses: actions/cache@v4
        with:
          path: dist/vstbridge-fex-aarch64.tar.xz
          key: fex-${{ hashFiles('aarch64/versions.sh', 'aarch64/lib.sh', 'aarch64/build-fex.sh') }}

      - name: Build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          apt-get install -y -q --no-install-recommends \
            build-essential cmake ninja-build python3 curl

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p dist
          aarch64/build-fex.sh "$RUNNER_TEMP/fex" dist/vstbridge-fex-aarch64.tar.xz

      - name: Check the binaries
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/check"
          tar -C "$RUNNER_TEMP/check" -xJf dist/vstbridge-fex-aarch64.tar.xz
          find "$RUNNER_TEMP/check" -type f -exec file {} +

      - uses: actions/upload-artifact@v4
        with:
          name: vstbridge-fex-aarch64
          path: dist/vstbridge-fex-aarch64.tar.xz
          compression-level: 0

  native:
    name: Plugin libraries, plugin host and vstbridgectl
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    env:
      DEBIAN_FRONTEND: noninteractive
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Build dependencies
        run: |
          set -eu
          apt-get update -q
          apt-get install -y -q --no-install-recommends \
            build-essential meson ninja-build pkg-config cmake git ca-certificates file python3 \
            curl xz-utils libdbus-1-dev libgtk-3-dev libxcb1-dev

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.VSTBRIDGE_REPOSITORY }}
          ref: ${{ env.VSTBRIDGE_REF }}
          # The package version counts the commits
          fetch-depth: 0

      - name: Cache llvm-mingw
        uses: actions/cache@v4
        with:
          path: toolchain
          key: llvm-mingw-${{ hashFiles('aarch64/versions.sh') }}

      - name: llvm-mingw
        run: |
          set -eu
          . aarch64/versions.sh
          . aarch64/lib.sh
          fetch_llvm_mingw "$PWD/toolchain"
          dirname "$(command -v arm64ec-w64-mingw32-clang++)" >> "$GITHUB_PATH"

      - name: Configure
        working-directory: vstbridge
        run: |
          meson setup build --buildtype=release \
            -Dwine-host=pe --cross-file cross-arm64ec.conf \
            -Dwine-loader=/opt/vstbridge/wine/bin/wine

      # <meson version>+git<commits>.<commit>: newer commits get higher versions
      - name: Version
        id: version
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          meson_version="$(meson introspect vstbridge/build --projectinfo | python3 -c 'import json, sys; print(json.load(sys.stdin)["version"])')"
          version="${meson_version}+git$(git rev-list --count HEAD).$(git rev-parse --short=9 HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "vstbridge $version"

      - name: Build plugin libraries and plugin host
        working-directory: vstbridge
        run: ninja -C build

      - name: Build vstbridgectl
        working-directory: vstbridge/tools/vstbridgectl
        run: make -j"$(nproc)" WINE_LOADER=/opt/vstbridge/wine/bin/wine

      - name: Check the binaries
        run: |
          set -eu
          fail=0
          for f in vstbridge/build/lib*.so vstbridge/build/vstbridge-host-unixlib.so \
                   vstbridge/tools/vstbridgectl/build/vstbridgectl*; do
            desc="$(file -b "$f")"
            echo "$f: $desc"
            case "$desc" in
              *"ARM aarch64"*) ;;
              *) echo "::error::$f is not an aarch64 binary"; fail=1 ;;
            esac
          done

          # ARM64EC executables use the x64 machine type in their PE header. The ARM64EC
          # code is described by the CHPE metadata in the load config.
          host=vstbridge/build/vstbridge-host.exe
          file -b "$host"
          if ! llvm-readobj --coff-load-config "$host" | grep -q '^CHPEMetadata \['; then
            echo "::error::$host is not an ARM64EC executable"
            fail=1
          fi
          exit "$fail"

      # The tarball holds a single `vstbridge` directory, so extracting it in ~/.local/share
      # gives ~/.local/share/vstbridge, where vstbridgectl looks by default.
      - name: Stage
        run: |
          set -eu
          dist=dist/vstbridge
          mkdir -p "$dist"
          cp -a vstbridge/build/lib*.so vstbridge/build/vstbridge-host.exe \
            vstbridge/build/vstbridge-host-unixlib.so "$dist/"
          cp -a vstbridge/tools/vstbridgectl/build/vstbridgectl vstbridge/tools/vstbridgectl/build/vstbridgectl-gtk "$dist/"
          cp -a vstbridge/install.sh vstbridge/uninstall.sh "$dist/"
          tar -C dist -czf dist/vstbridge-aarch64.tar.gz vstbridge

      - uses: actions/upload-artifact@v4
        with:
          name: vstbridge-aarch64
          path: dist/vstbridge-aarch64.tar.gz

  debs:
    name: Packages
    needs: [wine, fex, native]
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      # The libraries Wine was built against, so build-debs.sh can find the packages of the
      # ones Wine loads at runtime (the same list as the wine job's build dependencies)
      - name: Tools and Wine's libraries
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends \
            dpkg-dev file curl xz-utils binutils ca-certificates \
            libx11-dev libxext-dev libxcomposite-dev libxcursor-dev libxfixes-dev libxinerama-dev \
            libxi-dev libxrandr-dev libxrender-dev libxxf86vm-dev \
            libegl-dev libgl-dev libvulkan-dev \
            libfreetype-dev libfontconfig-dev libgnutls28-dev \
            libasound2-dev libdbus-1-dev libudev-dev \
            libdbus-1-3 libgtk-3-0t64 libxcb1

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.VSTBRIDGE_REPOSITORY }}
          ref: ${{ env.VSTBRIDGE_REF }}

      - name: Cache llvm-mingw
        uses: actions/cache@v4
        with:
          path: toolchain
          key: llvm-mingw-${{ hashFiles('aarch64/versions.sh') }}

      - uses: actions/download-artifact@v4
        with:
          path: dl

      - name: Build the packages
        env:
          TOOLCHAIN_DIR: ${{ github.workspace }}/toolchain
        run: |
          aarch64/build-debs.sh debs \
            dl/vstbridge-wine-aarch64/vstbridge-wine-aarch64.tar.xz \
            dl/vstbridge-fex-aarch64/vstbridge-fex-aarch64.tar.xz \
            dl/vstbridge-aarch64/vstbridge-aarch64.tar.gz \
            "${{ needs.native.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: pivuan-debs
          path: debs/*.deb
          if-no-files-found: error
          compression-level: 0

  check:
    name: Install and run the packages
    needs: debs
    runs-on: ubuntu-24.04-arm
    container: debian:trixie
    timeout-minutes: 60
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pivuan-debs
          path: debs

      - name: Install
        run: |
          set -eu
          apt-get update -q
          apt-get install -y -q --no-install-recommends file ./debs/*.deb
          for deb in debs/*.deb; do
            echo "::group::$(basename "$deb")"
            dpkg-deb -I "$deb"
            echo "::endgroup::"
          done

      - name: Every program and library finds its libraries
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          # Wine's Unix libraries also link to each other (ntdll.so, win32u.so), which Wine
          # loads from its own directory
          export LD_LIBRARY_PATH=/opt/vstbridge/wine/lib/wine/aarch64-unix
          for pkg in wine-fex vstbridge; do
            while IFS= read -r f; do
              [[ -f "$f" && ! -L "$f" ]] && file -b "$f" | grep -q '^ELF' || continue
              if ldd "$f" 2>&1 | grep -q 'not found'; then
                echo "::error::$f: $(ldd "$f" | grep 'not found' | tr '\n' ' ')"
                fail=1
              fi
            done < <(dpkg -L "$pkg")
          done
          exit "$fail"

      # vstbridgectl must find the system-wide install, and sync runs the plugin host through
      # Wine. That creates ~/.wine, which must get Mono from wine-fex-mono without a download.
      # Wine must not run as root, and on Pivuan it never does: it runs as the logged-in user,
      # in their own ~/.wine. So this runs as a normal user with its own home, like a Pivuan user.
      # sync only warns when the host doesn't run, so its output is checked too.
      - name: vstbridgectl sync, as a normal user
        shell: bash
        run: |
          set -euo pipefail
          useradd --create-home pivuan
          cat > /tmp/sync-check.sh <<'EOF'
          wine --version
          vstbridgectl status
          mkdir -p "$HOME/plugins"
          vstbridgectl add "$HOME/plugins"
          vstbridgectl sync 2>&1 | tee "$HOME/sync.log"
          if grep -q "Could not run" "$HOME/sync.log"; then
            echo "::error::vstbridgectl sync could not run the plugin host"
            exit 1
          fi
          test -d "$HOME/.wine/drive_c/windows/mono"
          wineserver -k || true
          EOF
          runuser -u pivuan -- env HOME=/home/pivuan bash -euxo pipefail /tmp/sync-check.sh
