# Cross file for building the PE plugin host as a regular x86_64 Windows
# program with `-Dwine-host=pe`. This is the same host as the ARM64EC build in
# cross-arm64ec.conf, and is mostly useful for testing it with x86_64 Wine.
# Needs llvm-mingw's toolchain on the PATH.

[binaries]
c = 'x86_64-w64-mingw32-clang'
cpp = 'x86_64-w64-mingw32-clang++'
ar = 'x86_64-w64-mingw32-ar'
strip = 'x86_64-w64-mingw32-strip'
windres = 'x86_64-w64-mingw32-windres'
pkg-config = 'pkg-config'
cmake = 'cmake'

[properties]
needs_exe_wrapper = true

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
