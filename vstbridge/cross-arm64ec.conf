# Cross file for the ARM64EC PE plugin host, used on aarch64 with
# `-Dwine-host=pe`. Needs llvm-mingw's toolchain on the PATH (see
# aarch64/versions.sh for the pinned version). The native plugin libraries and
# the host's unixlib are still built with the system compiler.

[binaries]
c = 'arm64ec-w64-mingw32-clang'
cpp = 'arm64ec-w64-mingw32-clang++'
ar = 'arm64ec-w64-mingw32-ar'
strip = 'arm64ec-w64-mingw32-strip'
windres = 'arm64ec-w64-mingw32-windres'
pkg-config = 'pkg-config'
cmake = 'cmake'

[properties]
needs_exe_wrapper = true

[host_machine]
system = 'windows'
cpu_family = 'aarch64'
cpu = 'arm64ec'
endian = 'little'
