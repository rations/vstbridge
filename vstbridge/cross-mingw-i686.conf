# Cross file for building the 32-bit PE plugin host (`vstbridge-host-32.exe`)
# with `-Dwine-host=pe`, for running 32-bit plugins on a WoW64 Wine. The
# native plugin libraries are built with `-Dpe-bitbridge=true` in a separate
# build directory. Needs llvm-mingw's toolchain on the PATH.

[binaries]
c = 'i686-w64-mingw32-clang'
cpp = 'i686-w64-mingw32-clang++'
ar = 'i686-w64-mingw32-ar'
strip = 'i686-w64-mingw32-strip'
windres = 'i686-w64-mingw32-windres'
pkg-config = 'pkg-config'
cmake = 'cmake'

[properties]
needs_exe_wrapper = true

[host_machine]
system = 'windows'
cpu_family = 'x86'
cpu = 'i686'
endian = 'little'
