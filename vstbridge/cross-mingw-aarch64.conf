# Cross file for building the native ARM64 PE plugin host
# (`vstbridge-host-arm64.exe`) with `-Dwine-host=pe`, for running ARM64 Windows
# plugins on aarch64 without emulation. It's built in a separate build
# directory and installed next to the ARM64EC host from cross-arm64ec.conf,
# which keeps running the x86_64 plugins. Needs llvm-mingw's toolchain on the
# PATH.

[binaries]
c = 'aarch64-w64-mingw32-clang'
cpp = 'aarch64-w64-mingw32-clang++'
ar = 'aarch64-w64-mingw32-ar'
strip = 'aarch64-w64-mingw32-strip'
windres = 'aarch64-w64-mingw32-windres'
pkg-config = 'pkg-config'
cmake = 'cmake'

[properties]
needs_exe_wrapper = true

[host_machine]
system = 'windows'
cpu_family = 'aarch64'
cpu = 'aarch64'
endian = 'little'
